<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Goli</title>
    <style>
      :root { color: #17241e; background: #f7f5ef; font-family: system-ui, sans-serif; }
      body { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      h1 { margin-bottom: 4px; font-size: 36px; } h2 { margin-top: 0; }
      form, .row { margin: 14px 0; padding: 16px; border: 1px solid #ddd; border-radius: 10px; background: #fff; }
      input { min-width: 220px; margin: 5px 8px 5px 0; padding: 10px; border: 1px solid #aaa; border-radius: 6px; }
      button, .button { padding: 10px 14px; border: 0; border-radius: 6px; background: #17241e; color: #fff; cursor: pointer; text-decoration: none; }
      button.danger { background: #a82f2f; } .row { display: grid; grid-template-columns: 150px 1fr 90px auto; gap: 12px; align-items: center; }
      .muted { color: #58645d; font-size: 14px; } .error { color: #a82f2f; }
      @media (max-width:680px) { .row { grid-template-columns: 1fr; } input { width: 100%; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Goli</h1><p class="muted">Shortcuts that stay on this Mac.</p></div>
      <div><a class="button" href="/api/export">Export JSON</a> <button onclick="document.querySelector('#import').click()">Import</button><input id="import" hidden type="file" accept="application/json" /></div>
    </header>
    <form id="create"><h2>New shortcut</h2><input name="slug" placeholder="resume" required pattern="[a-z0-9]+(-[a-z0-9]+)*" /><input name="destinationUrl" type="url" placeholder="https://example.com" required /><button>Create link</button><p id="message" class="error"></p></form>
    <input id="search" placeholder="Search links" />
    <section id="links"></section>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const api = (url, options = {}) => fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } }).then(async (response) => {
        if (!response.ok) throw Error((await response.json()).error);
        return response.status === 204 ? null : response.json();
      });
      let links = [];
      function render() {
        const query = $('#search').value.toLowerCase();
        const filtered = links.filter((link) => link.slug.includes(query) || link.destinationUrl.toLowerCase().includes(query));
        $('#links').innerHTML = filtered.map((link) => `<div class="row"><strong>go.li/${link.slug}</strong><a href="${link.destinationUrl}" target="_blank" rel="noreferrer">${link.destinationUrl}</a><span class="muted">${link.visits} visits</span><span><button onclick="copyLink('${link.slug}')">Copy</button> <button onclick="editLink('${link.id}')">Edit</button> <button class="danger" onclick="removeLink('${link.id}')">Delete</button></span></div>`).join('') || '<p class="muted">No links yet.</p>';
      }
      async function load() { links = await api('/api/links'); render(); }
      async function copyLink(slug) { await navigator.clipboard.writeText(`https://go.li/${slug}`); }
      async function editLink(id) {
        const link = links.find((item) => item.id === id);
        const slug = prompt('Slug', link.slug); if (slug === null) return;
        const destinationUrl = prompt('Destination URL', link.destinationUrl); if (destinationUrl === null) return;
        try { await api(`/api/links/${id}`, { method: 'PATCH', body: JSON.stringify({ slug, destinationUrl }) }); load(); } catch (error) { alert(error.message); }
      }
      async function removeLink(id) { if (confirm('Delete this shortcut?')) { await api(`/api/links/${id}`, { method: 'DELETE' }); load(); } }
      $('#create').onsubmit = async (event) => { event.preventDefault(); $('#message').textContent = ''; try { await api('/api/links', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); event.target.reset(); load(); } catch (error) { $('#message').textContent = error.message; } };
      $('#search').oninput = render;
      $('#import').onchange = async (event) => { const file = event.target.files[0]; if (!file) return; try { await api('/api/import', { method: 'POST', body: await file.text() }); load(); } catch (error) { alert(error.message); } };
      load();
    </script>
  </body>
</html>
