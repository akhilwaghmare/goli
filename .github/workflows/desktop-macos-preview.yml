name: Desktop macOS preview

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'preview:mac' || contains(github.event.pull_request.labels.*.name, 'preview:mac')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: bun install --frozen-lockfile
      - name: Build internal preview package
        env: { VERSION: 0.1.0-preview.${{ github.run_number }} }
        run: |
          node apps/desktop/scripts/set-version.mjs "$VERSION"
          bun run package:macos
      - uses: actions/upload-artifact@v4
        with: { name: goli-macos-preview, path: dist/goli-macos.pkg }
      - name: Publish rolling prerelease asset
        if: github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          gh release view desktop-preview >/dev/null 2>&1 || gh release create desktop-preview --prerelease --title "Goli desktop previews" --notes "Unsigned internal testing builds."
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}"
          package="goli-macos-${version}.pkg"
          mv dist/goli-macos.pkg "dist/${package}"
          checksum="$(shasum -a 256 "dist/${package}" | awk '{print $1}')"
          cat > dist/goli-update.json <<EOF
          {"version":"${version}","packageUrl":"https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-preview/${package}","sha256":"${checksum}","notesUrl":"https://github.com/${GITHUB_REPOSITORY}/releases/tag/desktop-preview"}
          EOF
          gh release upload desktop-preview "dist/${package}" dist/goli-update.json --clobber
